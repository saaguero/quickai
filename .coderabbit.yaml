# CodeRabbit settings. Reference: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

# The master filter: defects only, no cosmetics.
tone_instructions: >-
  Flag only real defects: correctness, security, privacy, data loss, resource
  leaks, concurrency. Skip style, naming, formatting and documentation nits.

reviews:
  profile: chill
  # false: this key writes "Summary by CodeRabbit" into the PR description,
  # which the squash-merge dialog then inherits into the commit message.
  high_level_summary: false
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  finishing_touches:
    docstrings:
      enabled: false
  path_instructions:
    - path: "**"
      instructions: >-
        Comment only on real defects: correctness, security, privacy, data
        loss, resource leaks, concurrency. Do not comment on style, naming,
        formatting or documentation nits.
    - path: "Sources/QuickAI/**"
      instructions: >-
        AGENTS.md at the repo root is the contract; its invariants outrank any
        general best practice. Flag anything that could put a turn on API
        billing (removing an env scrub layer, --bare, BYOK), weaken the
        no-tools floor of lean and safe mode, write into the user's own agent
        state or config, or destroy user data without a confirmation. Do not
        propose stylistic refactors and do not comment on formatting.
  tools:
    # Security stays on, pure-style linters stay off. Semgrep is not listed:
    # it only runs with a repo-local semgrep.yml, which does not exist yet.
    gitleaks:
      enabled: true
    swiftlint:
      enabled: false
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true
